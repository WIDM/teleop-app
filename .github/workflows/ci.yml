name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for test_ar_ui.cjs
        run: npx playwright install --with-deps chromium
      - name: ESLint
        run: npx eslint .
      - name: node --test
        run: npm test
